name: Import attributed FreshRetailNet observations
on:
  push:
    branches:
      - feat/freshtwin-real-data-catalog
    paths:
      - scripts/import_freshretail.py
      - .github/workflows/import-freshretail.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data conversion dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Download real benchmark observations and create public assets
        run: python scripts/import_freshretail.py
      - name: Verify asset count and provenance
        run: |
          python - <<'PY'
          import json,pathlib
          data=pathlib.Path('public/data')
          c=json.loads((data/'catalog.json').read_text())
          assert c['license']=='CC BY 4.0'
          assert len(c['catalog'])>=800
          assert len(list(data.glob('part-*.json')))==16
          assert c['selectedRows']>=70000
          print('Validated actual historical observations:',len(c['catalog']),'products')
          PY
      - name: Commit curated public dataset assets to the feature branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/catalog.json public/data/part-*.json
          if git diff --cached --quiet; then echo 'Data assets already current'; exit 0; fi
          git commit -m 'data: import attributed real FreshRetailNet-50K product histories'
          git push origin "HEAD:${BRANCH}"