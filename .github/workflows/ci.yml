name: Verify FreshTwin
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Joint allocation sensitivity benchmark
        run: npm run benchmark
      - run: npm run build
      - name: Preserve optimization benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: freshtwin-numerical-benchmarks
          path: benchmark-results/joint-summary.json
          if-no-files-found: error
      - name: Check deployment bundle
        run: test -s dist/index.html && test -s dist/app.js && test -s dist/engine.js && test -s dist/styles.css && test -s dist/joint.js && test -s dist/joint-ui.js && test -s dist/joint.css
