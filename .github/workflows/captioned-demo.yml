name: Capture FreshTwin v0.5 demonstration
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/record_guided_demo.mjs'
      - 'scripts/build_assignment_evidence_docx.py'
      - '.github/workflows/captioned-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freshtwin-recording-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRESHTWIN_URL: https://freshtwin-inventory-digital-twin.nirman-bhowmike.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Await deployed v0.5 release and attributed research catalog
        run: |
          ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent --location --compressed --max-time 20 "$FRESHTWIN_URL" | grep -q 'Version 0.5.0' && \
               curl --fail --silent --location --compressed --max-time 20 "${FRESHTWIN_URL}data/catalog.json" | grep -q 'FreshRetailNet-50K'; then
              ready=1
              break
            fi
            echo "Waiting for real public deployment ($i/20)."
            sleep 15
          done
          test "$ready" -eq 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Record real browser walkthrough with on-screen explanations
        run: node scripts/record_guided_demo.mjs
      - name: Convert recording to MP4 where available
        run: |
          if command -v ffmpeg >/dev/null; then
            ffmpeg -hide_banner -loglevel error -y -i .demo-artifacts/FreshTwin_v05_Captioned_Demonstration.webm \
              -c:v libx264 -pix_fmt yuv420p -preset fast -crf 23 -movflags +faststart \
              .demo-artifacts/FreshTwin_v05_Captioned_Demonstration.mp4
          fi
      - name: Build instructor-aligned two-page research worksheet from real screenshots
        run: |
          python -m pip install --quiet python-docx pillow
          python scripts/build_assignment_evidence_docx.py
          test -s .demo-artifacts/FreshTwin_Quick_AI_Assignment_Two_Page_Review_Draft.docx
      - name: Publish actual recording and 8 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreshTwin-v05-actual-browser-video-and-screenshots
          path: .demo-artifacts/
          if-no-files-found: error
          include-hidden-files: true