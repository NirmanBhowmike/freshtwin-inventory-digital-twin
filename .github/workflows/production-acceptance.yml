name: Verify FreshTwin live Cloudflare deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FRESHTWIN_URL: https://freshtwin-inventory-digital-twin.nirman-bhowmike.workers.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Await public version 0.4.0 after Cloudflare Git deployment
        run: |
          ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent --show-error --location --compressed --max-time 20 "$FRESHTWIN_URL" | grep -q 'Version 0.4.0'; then
              echo "FreshTwin 0.4.0 is available on the public Cloudflare endpoint."
              ready=1
              break
            fi
            echo "Cloudflare has not served the expected release yet (attempt $i/20)."
            sleep 15
          done
          test "$ready" -eq 1
          curl --fail --silent --show-error --location --compressed --max-time 20 "${FRESHTWIN_URL}data/catalog.json" | grep -q 'FreshRetailNet-50K'
      - name: Install Chromium browser harness
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run complete 24-check acceptance against live production
        run: node scripts/browser_acceptance.mjs
      - name: Preserve screenshots and measured browser outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freshtwin-v04-production-acceptance
          path: .browser-artifacts/
          if-no-files-found: ignore
